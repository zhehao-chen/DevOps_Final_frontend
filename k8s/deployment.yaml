apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: dev
  labels:
    app: frontend-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
        - name: frontend-service
          image: zhehaochen/frontend-service:IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: REACT_APP_PRODUCT_SERVICE_URL
              value: http://product-service:5001
            - name: REACT_APP_ORDER_SERVICE_URL
              value: http://order-service:5002
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: dev
spec:
  selector:
    app: frontend-service
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service-nodeport
  namespace: dev
spec:
  selector:
    app: frontend-service
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30000
  type: NodePort
